name: Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: hralkh01
          outputs: |
           dist/github-contribution-grid-snake.svg?color_snake=F76900
           dist/github-contribution-grid-snake-dark.svg?color_snake=F76900&color_dots=#161B22,#2D1B0F,#5C2E00,#A14D00,#F76900

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
