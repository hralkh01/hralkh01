name: Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: hralkh01
          outputs: |
            dist/github-contribution-grid-snake.svg?&color_dots=#ebedf0,#ffd1b0,#ffb380,#ff8c42,#f76900
            dist/github-contribution-grid-snake-dark.svg?&color_dots=#161b22,#4d2a0a,#8a4b08,#c96a00,#f76900
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
